<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gabriel Penedo</title>
    <meta
      name="description"
      content="Gabriel Penedo is an environmental computing researcher working on reliable environmental AI, field-grounded machine learning, and geospatial decision systems."
    />
    <meta name="theme-color" content="#FCFCFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://gabrielpenedo.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
    <script>
      // Set the theme before React mounts so there is no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : prefersDark;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* localStorage unavailable; fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
